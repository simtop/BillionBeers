gradle.projectsEvaluated {
    def app = gradle.rootProject.findProject(':app')
    if (app == null) {
        return
    }
    def runtime = app.configurations.getByName('releaseRuntimeClasspath')
    def modules = [app] + app.extensions.getByName('android').dynamicFeatures.sort().collect {
        gradle.rootProject.project(it)
    }
    def exportGraph = gradle.startParameter.projectProperties.get('dependencyApiExportGraph')
    if (exportGraph != null) {
        def exports = modules.collect { module ->
            def target = new File(module.layout.buildDirectory.get().asFile, 'dependency-linkage/graph.txt')
            module.tasks.register('exportDependencyApiModuleGraph') {
                outputs.file(target)
                // A dependency update can change resolution without changing this task's files.
                outputs.upToDateWhen { false }
                doLast {
                    def coordinates = new TreeSet<String>()
                    module.configurations.getByName('releaseRuntimeClasspath').incoming.resolutionResult
                        .allComponents.each { component ->
                            if (component.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                                coordinates.add("${component.id.group}:${component.id.module}:${component.id.version}".toString())
                            }
                        }
                    target.parentFile.mkdirs()
                    target.text = coordinates.join('\n') + '\n'
                }
            }
        }
        app.tasks.register('exportDependencyApiGraph') {
            dependsOn(exports)
            doLast {
                def target = new File(exportGraph)
                target.parentFile.mkdirs()
                new File(target.parentFile, "${target.name}.modules").text = modules.collect { it.path }.join('\n') + '\n'
                exports.eachWithIndex { task, index ->
                    def graph = task.get().outputs.files.singleFile.text
                    def slug = modules[index].path.replace(':', '_')
                    new File(target.parentFile, "${target.name}.${slug}.txt").text = graph
                    if (index == 0) target.text = graph
                }
            }
        }
        return
    }
    def oldGraphFile = new File(gradle.startParameter.projectProperties.get('dependencyApiOldGraph'))
    def newGraphFile = new File(gradle.startParameter.projectProperties.get('dependencyApiNewGraph'))
    def outputDir = new File(gradle.startParameter.projectProperties.get('dependencyApiOutput'))
    def makeGraphConfiguration = { String name, File graphFile ->
        def coordinates = graphFile == null ? [] as Set : graphFile.readLines().findAll { it.trim() }.collect { it.trim() } as Set
        def configuration = app.configurations.create(name) {
            canBeConsumed = false
            canBeResolved = true
            transitive = false
        }
        runtime.attributes.keySet().each { key ->
            def value = runtime.attributes.getAttribute(key)
            if (value != null) {
                configuration.attributes.attribute(key, value)
            }
        }
        coordinates.each { coordinate ->
            app.dependencies.add(configuration.name, coordinate)
        }
        [configuration: configuration, coordinates: coordinates]
    }
    def oldModules = new File(oldGraphFile.parentFile, "${oldGraphFile.name}.modules").readLines() as Set
    def contexts = modules.collect { module ->
        def slug = module.path.replace(':', '_')
        // A feature introduced by this PR has no base consumer context.
        def before = oldModules.contains(module.path) ? new File(oldGraphFile.parentFile, "${oldGraphFile.name}.${slug}.txt") : null
        def after = new File(newGraphFile.parentFile, "${newGraphFile.name}.${slug}.txt")
        [name: module.path, slug: slug, before: before, after: after,
         old: makeGraphConfiguration("dependencyApiOldGraph${slug}", before),
         next: makeGraphConfiguration("dependencyApiNewGraph${slug}", after)]
    }

    app.tasks.register('resolveDependencyApiArtifacts') {
        group = 'verification'
        description = 'Exports release consumers and separate before/after module classpaths.'
        dependsOn(modules.collect { "${it.path}:exportReleaseDependencyConsumers" })
        doLast {
            outputDir.mkdirs()
            def consumers = modules.collect {
                new File(it.layout.buildDirectory.get().asFile, 'dependency-linkage/consumers.tsv').text
            }.join('')
            new File(outputDir, 'contexts.tsv').withWriter('UTF-8') { contextWriter ->
                contexts.each { context ->
                    def directory = new File(outputDir, context.slug)
                    directory.mkdirs()
                    new File(directory, 'before.txt').text = context.before == null ? '' : context.before.text
                    new File(directory, 'after.txt').text = context.after.text
                    new File(directory, 'consumers.tsv').text = consumers
                    contextWriter.write("${context.name}\t${directory.absolutePath}\n")
                    new File(directory, 'artifacts.tsv').withWriter('UTF-8') { writer ->
                        [[name: 'old', graph: context.old], [name: 'new', graph: context.next]].each { side ->
                            side.graph.configuration.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                                def module = artifact.moduleVersion.id
                                String coordinate = "${module.group}:${module.name}:${module.version}".toString()
                                if (side.graph.coordinates.contains(coordinate)) {
                                    def targetDir = new File(directory, side.name)
                                    targetDir.mkdirs()
                                    def target = new File(targetDir, "${module.group}-${module.name}-${module.version}-${artifact.file.name}")
                                    java.nio.file.Files.copy(artifact.file.toPath(), target.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                                    writer.write("${side.name}\t${coordinate}\t${target.absolutePath}\n")
                                }
                            }
                        }
                    }
                }
            }
            println("Exported release linkage contexts to ${outputDir}")
        }
    }
}
