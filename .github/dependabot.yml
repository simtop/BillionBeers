version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      # gradle/libs.versions.toml has ~130+ entries organized into these same categories
      # (see the comments in [versions]) - mirroring that grouping here keeps monthly PR volume
      # sane. Major version bumps are deliberately excluded from every group (update-types below)
      # so they always get their own PR for individual review, never silently bundled with
      # routine minor/patch updates.
      kotlin-and-ksp:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
        exclude-patterns:
          - "org.jetbrains.kotlinx*"
        update-types:
          - "minor"
          - "patch"
      metro:
        patterns:
          - "dev.zacsweers.metro*"
        update-types:
          - "minor"
          - "patch"
      android-platform:
        patterns:
          - "androidx.*"
          - "com.google.android.material*"
          - "com.google.android.play*"
        exclude-patterns:
          - "androidx.compose*"
          - "androidx.activity:activity-compose*"
        update-types:
          - "minor"
          - "patch"
      compose:
        patterns:
          - "org.jetbrains.compose*"
          - "androidx.compose*"
          - "androidx.activity:activity-compose*"
        update-types:
          - "minor"
          - "patch"
      networking:
        patterns:
          - "com.squareup.okhttp3*"
          - "com.squareup.retrofit2*"
          - "io.ktor*"
        update-types:
          - "minor"
          - "patch"
      image-loading:
        patterns:
          - "io.coil-kt*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "io.mockk*"
          - "org.junit*"
          - "junit:junit"
          - "io.strikt*"
          - "org.amshove.kluent*"
          - "com.lemonappdev*"
          - "app.cash.paparazzi*"
          - "app.cash.turbine*"
        update-types:
          - "minor"
          - "patch"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
        update-types:
          - "minor"
          - "patch"
      build-tooling:
        patterns:
          - "com.diffplug.spotless*"
          - "com.facebook:ktfmt"
          - "io.gitlab.arturbosch.detekt*"
          - "com.squareup:kotlinpoet*"
          - "com.android.tools.build*"
          - "de.mannodermaus*"
          - "io.nlopez.compose.rules*"
          - "com.dropbox.dependency-guard*"
          - "org.webjars.npm*"
        update-types:
          - "minor"
          - "patch"
      other:
        patterns:
          - "javax.inject*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
