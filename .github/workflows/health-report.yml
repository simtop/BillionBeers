name: Weekly Health Report

# Aggregates read-only health checks into Markdown and versioned JSON. The current report is
# published in the run's Step Summary and retained as a downloadable artifact. The tracked
# docs/health/SAMPLE.md is explicitly historical and is never overwritten by this workflow.

on:
  schedule:
    # 07:00 UTC every Saturday (after the forward-compat lane at 06:00).
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  health-report:
    name: Generate health report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Download previous health data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/previous-health
          if ! runs_json=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/health-report.yml/runs?status=success&per_page=20"); then
            echo "Previous health run lookup failed; generating without deltas."
            exit 0
          fi
          run_id=$(python3 -c 'import json,sys; runs=json.load(sys.stdin).get("workflow_runs", []); print(runs[0]["id"] if runs else "")' <<< "$runs_json")
          if [ -z "$run_id" ]; then
            echo "No previous successful health run; generating without deltas."
            exit 0
          fi
          if ! artifacts_json=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100"); then
            echo "Previous artifact lookup failed; generating without deltas."
            exit 0
          fi
          artifact_id=$(python3 -c 'import json,sys; artifacts=json.load(sys.stdin).get("artifacts", []); matches=[a for a in artifacts if a.get("name") == "health-report" and not a.get("expired")]; print(matches[0]["id"] if matches else "")' <<< "$artifacts_json")
          if [ -z "$artifact_id" ]; then
            echo "No retained health-report artifact; generating without deltas."
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > build/previous-health.zip; then
            echo "Previous artifact download failed; generating without deltas."
            exit 0
          fi
          if ! python3 -m zipfile -e build/previous-health.zip build/previous-health; then
            echo "Previous artifact extraction failed; generating without deltas."
            exit 0
          fi
          echo "Downloaded health data from workflow run ${run_id}."

      - name: Generate health report
        run: |
          previous_args=()
          previous_json=$(find build/previous-health -name health.json -print -quit 2>/dev/null || true)
          if [ -n "$previous_json" ]; then
            previous_args=(--previous-json "$previous_json")
          fi
          bash scripts/health-report.sh --run \
            --json build/reports/health/health.json \
            "${previous_args[@]}" \
            build/reports/health/report.md
          python3 -m json.tool build/reports/health/health.json >/dev/null

      - name: Publish to run summary
        if: always()
        run: cat build/reports/health/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Archive health report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: health-report
          path: build/reports/health
          retention-days: 30
          if-no-files-found: error
