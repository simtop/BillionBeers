name: Regenerate Verification Metadata
run-name: Dependency preparation | mode=${{ inputs.mode || 'write' }} | ref=${{ github.head_ref || github.ref_name }}

# Preparation follows the immutable PR-head and ordinary pull_request model. Platform jobs
# never receive a write key. A single final job validates their independent ledgers, unions them,
# and is the only job allowed to push the guarded generated files.
on:
  workflow_call:
    inputs:
      mode:
        required: true
        type: string
  pull_request:
    branches: [main, master]
    paths:
      - 'gradle/libs.versions.toml'
      - 'gradle/wrapper/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '**/build.gradle.kts'
      - 'build-logic/**'
  workflow_dispatch:
    inputs:
      mode:
        description: Write the guarded union, or upload a non-pushing reference/candidate experiment
        required: true
        default: write
        type: choice
        options: [write, reference, candidate]
      approved_head_sha:
        description: Full head SHA of the reviewed coordinate change (write mode only)
        required: false
        type: string
      approved_graph_digest:
        description: Exact graph digest from the dependency-preparation artifact
        required: false
        type: string

permissions:
  contents: read

# GitHub concurrency keeps one running and at most one pending. A newer queued request can
# supersede an older pending request; users who need every ref prepared must dispatch again.
concurrency:
  group: dependency-verification-preparation-${{ github.repository_id }}
  cancel-in-progress: false

jobs:
  lanes:
    name: Regenerate verification-metadata.xml (${{ matrix.lane }})
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - lane: linux
            runner: ubuntu-latest
            timeout: 60
            gradle_runner: >-
              ./gradlew --max-workers=2
              "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Xlog:gc,gc+init:file=/tmp/unit-kotlin-gc-%p.log:time,uptime,level,tags"
          - lane: web
            runner: ubuntu-latest
            timeout: 35
            gradle_runner: >-
              ./gradlew --max-workers=2
              "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError -Xlog:gc,gc+init:file=/tmp/unit-kotlin-gc-%p.log:time,uptime,level,tags"
          - lane: managed
            runner: ubuntu-latest
            timeout: 90
          - lane: apple
            runner: macos-14
            timeout: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
    env:
      GRADLE_RUNNER: ${{ matrix.gradle_runner || './gradlew' }}
      IOS_RUNTIME: '18.2'
      IOS_DEVICE_NAME: 'BillionBeers iPhone 16'
      IOS_DEVICE_TYPE: 'com.apple.CoreSimulator.SimDeviceType.iPhone-16'
      IOS_HOST_DESTINATION: 'platform=iOS Simulator,name=BillionBeers iPhone 16,OS=18.2'
      XCODE_PATH: '/Applications/Xcode_16.2.app'
    steps:
      - name: Checkout immutable branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          # Only Linux runs verifyPaparazziDebug, which needs the real golden PNGs.
          lfs: ${{ matrix.lane == 'linux' }}
          persist-credentials: false

      - name: Select writer mode
        id: mode
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'write' }}
        run: |
          case "$REQUESTED_MODE" in write|reference|candidate) ;; *) exit 1 ;; esac
          echo "value=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"
          if [ "$REQUESTED_MODE" = candidate ]; then echo 'graph=candidate' >> "$GITHUB_OUTPUT"; else echo 'graph=reference' >> "$GITHUB_OUTPUT"; fi

      - name: Prevent writes to the default branch
        if: steps.mode.outputs.value == 'write'
        env:
          PREPARATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$PREPARATION_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Write mode must target a feature/Dependabot branch, never the default branch."
            exit 1
          fi

      - name: Snapshot inputs and original verification policy
        run: |
          cp app/dependencies/releaseRuntimeClasspath.txt "$RUNNER_TEMP/guard-before.txt"
          cp gradle/verification-metadata.xml "$RUNNER_TEMP/verification-metadata-before.xml"

      - name: Reuse only a validated prior write result
        id: reuse
        if: steps.mode.outputs.value == 'write' && !inputs.approved_head_sha && !inputs.approved_graph_digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
        run: |
          python3 .github/scripts/write-preparation-result.py find-reuse \
            --branch "$BRANCH" --source-sha "$SOURCE_SHA" --pr-number "$PR_NUMBER" \
            --current-run-id "$GITHUB_RUN_ID" --wait-seconds 120

      - name: Select pinned Xcode
        if: matrix.lane == 'apple' && steps.reuse.outputs.reuse != 'true'
        run: |
          test -d "$XCODE_PATH" || { echo "::error::Required Xcode is unavailable: $XCODE_PATH"; exit 1; }
          sudo xcode-select --switch "$XCODE_PATH"
          xcodebuild -version

      - name: Enable KVM
        if: matrix.lane == 'managed' && steps.reuse.outputs.reuse != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 23
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle cold
        if: steps.reuse.outputs.reuse != 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Make gradlew executable
        if: steps.reuse.outputs.reuse != 'true'
        run: chmod +x gradlew

      - name: Create and boot pinned Apple simulator
        if: matrix.lane == 'apple' && steps.reuse.outputs.reuse != 'true'
        run: |
          RUNTIME_ID="$(xcrun simctl list runtimes | awk -v runtime="iOS $IOS_RUNTIME (" 'index($0, runtime) && $0 !~ /unavailable/ {print $NF; exit}')"
          test -n "$RUNTIME_ID" || { echo "::error::Required simulator runtime is unavailable: iOS $IOS_RUNTIME"; exit 1; }
          DEVICE_UDID="$(xcrun simctl create "$IOS_DEVICE_NAME" "$IOS_DEVICE_TYPE" "$RUNTIME_ID")"
          test -n "$DEVICE_UDID"
          xcrun simctl boot "$DEVICE_UDID"
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Re-baseline dependency guard
        id: guard_baseline
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          ./gradlew --write-verification-metadata sha256 --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            :app:dependencyGuardBaseline

      - name: Review dependency coordinate changes
        id: coordinate_check
        if: steps.reuse.outputs.reuse != 'true'
        env:
          APPROVED_HEAD: ${{ inputs.approved_head_sha }}
          APPROVED_DIGEST: ${{ inputs.approved_graph_digest }}
        run: |
          python3 .github/scripts/dependabot-preparation.py \
            --before "$RUNNER_TEMP/guard-before.txt" \
            --after app/dependencies/releaseRuntimeClasspath.txt \
            --head-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/dependency-preparation" \
            --approved-head "$APPROVED_HEAD" --approved-digest "$APPROVED_DIGEST"

      - name: Apply mechanical formatting
        id: format
        if: steps.reuse.outputs.reuse != 'true'
        run: |
          make verification-metadata-format
          git diff --name-only -z -- '*.kt' '*.gradle.kts' > "$RUNNER_TEMP/formatting-files"
          python3 .github/scripts/snapshot-dependabot-preparation.py \
            "$RUNNER_TEMP/formatting-files" "$RUNNER_TEMP/prepared.patch"

      - name: Resolve and record platform lane
        id: regenerate
        if: steps.reuse.outputs.reuse != 'true'
        env:
          LANE: ${{ matrix.lane }}
          MODE: ${{ steps.mode.outputs.graph }}
          PREPARATION_MODE: ${{ steps.mode.outputs.value }}
          PREPARATION_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PREPARATION_SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e
          bash .github/scripts/run-dependabot-preparation.sh "$LANE" "$MODE" 2>&1 \
            | tee "$RUNNER_TEMP/verification-metadata-$LANE.log"
          status=${PIPESTATUS[0]}
          set -e
          classification=success
          if [ "$status" -ne 0 ]; then
            if grep -Fq "is not verified because it is not listed in the verification metadata" "$RUNNER_TEMP/verification-metadata-$LANE.log"; then
              classification=unlisted_artifact
            elif grep -Eiq "checksum.*(failed|mismatch|expected)|expected.*checksum|has been compromised" "$RUNNER_TEMP/verification-metadata-$LANE.log"; then
              classification=checksum_mismatch
            elif [ "$status" -eq 143 ] || [ "$status" -eq 130 ] || grep -Eq "(^|[[:space:]])Terminated$" "$RUNNER_TEMP/verification-metadata-$LANE.log"; then
              classification=operational_termination
            else
              classification=build_test_or_policy_failure
            fi
          fi
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Reject changed recorded hashes and verification policy
        id: verify_update
        if: always() && steps.reuse.outputs.reuse != 'true' && steps.regenerate.outcome == 'success'
        run: |
          python3 .github/scripts/check-verification-metadata-update.py \
            "$RUNNER_TEMP/verification-metadata-before.xml" gradle/verification-metadata.xml

      - name: Summarize lane failure
        if: always() && job.status != 'success'
        env:
          LANE: ${{ matrix.lane }}
          BASELINE: ${{ steps.guard_baseline.outcome }}
          COORDINATES: ${{ steps.coordinate_check.outputs.classification }}
          FORMAT: ${{ steps.format.outcome }}
          RESOLVE: ${{ steps.regenerate.outcome }}
          RESOLVE_CLASSIFICATION: ${{ steps.regenerate.outputs.classification }}
          VERIFY: ${{ steps.verify_update.outcome }}
        run: |
          result="${LANE} lane failed; no ledger was written."
          if [ "$BASELINE" = failure ]; then
            result="${LANE} lane dependency-guard re-baseline failed."
          elif [ "$COORDINATES" = coordinate_change ]; then
            result="${LANE} lane rejected added or removed dependency coordinates; review graph-review.json."
          elif [ "$FORMAT" = failure ]; then
            result="${LANE} lane could not apply the mechanical formatter."
          elif [ "$RESOLVE" = failure ]; then
            result="${LANE} lane resolver failed: ${RESOLVE_CLASSIFICATION}."
          elif [ "$VERIFY" = failure ]; then
            result="${LANE} lane changed a recorded checksum or verification policy."
          fi
          echo "### Dependency verification preparation" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "$result" >> "$GITHUB_STEP_SUMMARY"

      - name: Report lane coverage
        if: success()
        env:
          LANE: ${{ matrix.lane }}
          SKIPPED: ${{ steps.reuse.outputs.reuse }}
        run: |
          case "$LANE" in
            linux) coverage='Linux/JVM/Android-host: full KMP JVM, metadata and Android-host inventories, plain JVM tests, Android assembly, Paparazzi, architecture checks and coverage.' ;;
            web) coverage='Web: all KMP Wasm browser tests and the production Wasm distribution; these consuming tasks resolve Binaryen and Compose resources.' ;;
            managed) coverage='Managed devices: debug GMD tests and separate release-smoke tests/assemblies.' ;;
            apple) coverage='Apple: device and simulator native compiles, simulator/device framework links, iOS host build and iOS simulator tests.' ;;
          esac
          if [ "$SKIPPED" = true ]; then coverage="Validated reuse: $coverage (prior write result is attached below)."; fi
          echo "### Dependency preparation lane: $LANE" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "$coverage" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable lane evidence
        if: always()
        env:
          LANE: ${{ matrix.lane }}
          MODE: ${{ steps.mode.outputs.value }}
          GRAPH_MODE: ${{ steps.mode.outputs.graph }}
          LANE_CONCLUSION: ${{ job.status }}
          LANE_SKIP: ${{ steps.reuse.outputs.reuse == 'true' }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          destination="$RUNNER_TEMP/lane-evidence/$LANE"
          mkdir -p "$destination"
          if [ -f gradle/verification-metadata.xml ]; then cp gradle/verification-metadata.xml "$destination/verification-metadata.xml"; else cp "$RUNNER_TEMP/verification-metadata-before.xml" "$destination/verification-metadata.xml"; fi
          if [ -f "$RUNNER_TEMP/prepared.patch" ]; then cp "$RUNNER_TEMP/prepared.patch" "$destination/prepared.patch"; else : > "$destination/prepared.patch"; fi
          if [ -f "$RUNNER_TEMP/formatting-files" ]; then cp "$RUNNER_TEMP/formatting-files" "$destination/formatting-files"; else : > "$destination/formatting-files"; fi
          for report in graph-review.json graph-review.md; do
            if [ -f "$RUNNER_TEMP/dependency-preparation/$report" ]; then
              cp "$RUNNER_TEMP/dependency-preparation/$report" "$destination/$report"
            fi
          done
          python3 - "$destination/manifest.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          folder = Path(sys.argv[1]).parent
          manifest = {
              "lane": os.environ["LANE"], "head_sha": os.environ["HEAD_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_ref": os.environ["SOURCE_REF"], "mode": os.environ["MODE"],
              "graph_mode": os.environ["GRAPH_MODE"],
              "conclusion": os.environ["LANE_CONCLUSION"],
              "skipped": os.environ["LANE_SKIP"] == "true",
              "prepared_sha256": hashlib.sha256((folder / "prepared.patch").read_bytes()).hexdigest(),
              "formatting_files_sha256": hashlib.sha256((folder / "formatting-files").read_bytes()).hexdigest(),
          }
          review = folder / "graph-review.json"
          manifest["graph_digest"] = json.loads(review.read_text())["digest"] if review.is_file() else ""
          (folder / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY

      - name: Archive lane ledger and resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-preparation-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.mode.outputs.graph }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/lane-evidence/${{ matrix.lane }}/
          if-no-files-found: warn
          retention-days: 14

      - name: Archive resource and resolver logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-preparation-resources-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.mode.outputs.graph }}-${{ matrix.lane }}
          path: |
            ${{ runner.temp }}/verification-metadata-${{ matrix.lane }}.log
            ${{ runner.temp }}/dependency-preparation-resources.log
            /tmp/unit-kotlin-gc-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Archive diagnostic preparation evidence
        if: always() && matrix.lane == 'linux' && steps.mode.outputs.value == 'write'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dependency-preparation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dependency-preparation/
            ${{ runner.temp }}/verification-metadata-linux.log
            ${{ runner.temp }}/dependency-preparation-resources.log
            ${{ runner.temp }}/guard-before.txt
          if-no-files-found: warn
          retention-days: 14

  merge-and-write:
    name: Validate platform union and write generated files
    needs: lanes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          ssh-key: ${{ (inputs.mode || 'write') == 'write' && secrets.VERIFICATION_METADATA_DEPLOY_KEY || '' }}
          persist-credentials: ${{ (inputs.mode || 'write') == 'write' }}

      - name: Require every platform lane to succeed
        env:
          LANES_RESULT: ${{ needs.lanes.result }}
        run: |
          test "$LANES_RESULT" = success || {
            echo "::error::Every cold platform preparation lane must succeed before union or write."
            exit 1
          }

      - name: Recheck for a validated reusable preparation
        id: reuse
        if: (inputs.mode || 'write') == 'write'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
        run: |
          python3 .github/scripts/write-preparation-result.py find-reuse \
            --branch "$BRANCH" --source-sha "$SOURCE_SHA" --pr-number "$PR_NUMBER" \
            --current-run-id "$GITHUB_RUN_ID" --wait-seconds 120

      - name: Download Linux ledger and prepared patch
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-preparation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode == 'candidate' && 'candidate' || 'reference' }}-linux
          path: .platform-evidence/linux
      - name: Download Web ledger and prepared patch
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-preparation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode == 'candidate' && 'candidate' || 'reference' }}-web
          path: .platform-evidence/web
      - name: Download managed-device ledger and prepared patch
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dependency-preparation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode == 'candidate' && 'candidate' || 'reference' }}-managed
          path: .platform-evidence/managed
      - name: Download Apple ledger and prepared patch
        if: steps.reuse.outputs.reuse != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dependency-preparation-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.mode == 'candidate' && 'candidate' || 'reference' }}-apple
          path: .platform-evidence/apple

      - name: Validate lane identities and merge metadata safely
        if: steps.reuse.outputs.reuse != 'true'
        env:
          PREPARATION_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          SOURCE_REF: ${{ github.head_ref || github.ref_name }}
          EXPECTED_RUN_MODE: ${{ inputs.mode || 'write' }}
        run: |
          git show "$PREPARATION_HEAD:gradle/verification-metadata.xml" > "$RUNNER_TEMP/verification-metadata-before.xml"
          python3 .github/scripts/merge-verification-metadata-platforms.py \
            --evidence .platform-evidence \
            --before "$RUNNER_TEMP/verification-metadata-before.xml" \
            --head-sha "$PREPARATION_HEAD" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --source-ref "$SOURCE_REF" \
            --mode "$EXPECTED_RUN_MODE" \
            --output gradle/verification-metadata.xml
          cmp .platform-evidence/linux/prepared.patch .platform-evidence/web/prepared.patch
          cmp .platform-evidence/linux/prepared.patch .platform-evidence/managed/prepared.patch
          cmp .platform-evidence/linux/prepared.patch .platform-evidence/apple/prepared.patch
          if [ -s .platform-evidence/linux/prepared.patch ]; then
            git apply .platform-evidence/linux/prepared.patch
          fi
          cp .platform-evidence/linux/formatting-files "$RUNNER_TEMP/formatting-files"

      - name: Update generated documentation
        if: (inputs.mode || 'write') == 'write' && steps.reuse.outputs.reuse != 'true'
        run: make update-docs

      - name: Upload comparison ledger
        if: success() && inputs.mode != 'write' && inputs.mode != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: verification-metadata-${{ inputs.mode }}-${{ github.sha }}
          path: |
            gradle/verification-metadata.xml
            app/dependencies/releaseRuntimeClasspath.txt
          if-no-files-found: error
          retention-days: 14

      - name: Stage and commit complete generated output
        id: commit_output
        if: success() && (inputs.mode || 'write') == 'write'
        env:
          PREPARATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PREPARATION_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$PREPARATION_BRANCH" = "$DEFAULT_BRANCH" ]; then
            echo "::error::Refusing to write the default branch."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$PREPARATION_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$PREPARATION_HEAD" ]; then
            echo "::error::PR head changed during preparation; no generated files were pushed."
            exit 1
          fi
          if [ "${{ steps.reuse.outputs.reuse }}" = true ]; then
            output_sha="$PREPARATION_HEAD"
          else
            python3 .github/scripts/stage-dependabot-preparation.py "$RUNNER_TEMP/formatting-files"
            if git diff --cached --quiet; then
              echo "Generated files are already current; nothing to commit."
              output_sha="$PREPARATION_HEAD"
            else
              git commit -m "chore: regenerate dependency verification metadata"
              output_sha="$(git rev-parse HEAD)"
            fi
          fi
          echo "output_sha=$output_sha" >> "$GITHUB_OUTPUT"

      - name: Write authoritative preparation identity
        id: result
        if: success() && (inputs.mode || 'write') == 'write'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || 0 }}
          ORIGIN_RUN_ID: ${{ steps.reuse.outputs.origin_run_id }}
          ORIGIN_ATTEMPT: ${{ steps.reuse.outputs.origin_attempt }}
        run: |
          python3 .github/scripts/write-preparation-result.py write-result \
            --branch "$BRANCH" --source-sha "$SOURCE_SHA" \
            --output-sha "${{ steps.commit_output.outputs.output_sha }}" --pr-number "$PR_NUMBER" \
            --current-run-id "$GITHUB_RUN_ID" --evidence .platform-evidence \
            --origin-run-id "${ORIGIN_RUN_ID:-0}" --origin-attempt "${ORIGIN_ATTEMPT:-0}" \
            --output "$RUNNER_TEMP/authoritative-preparation.json"

      - name: Upload authoritative result before push
        if: success() && (inputs.mode || 'write') == 'write' && steps.result.outcome == 'success' && steps.result.outputs.pr_number != '' && steps.result.outputs.pr_number != '0'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: authoritative-preparation-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/authoritative-preparation.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify exact PR source before publishing
        if: success() && (inputs.mode || 'write') == 'write' && steps.result.outputs.pr_number != '0'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.result.outputs.pr_number }}
          PREPARATION_BRANCH: ${{ github.head_ref || github.ref_name }}
          PREPARATION_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git fetch origin "$PREPARATION_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$PREPARATION_HEAD"
          python3 .github/scripts/write-preparation-result.py verify-pr-head \
            --pr-number "$PR_NUMBER" --branch "$PREPARATION_BRANCH" --expected-sha "$PREPARATION_HEAD"

      - name: Push generated output
        if: success() && (inputs.mode || 'write') == 'write'
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          OUTPUT_SHA: ${{ steps.commit_output.outputs.output_sha }}
          PR_NUMBER: ${{ steps.result.outputs.pr_number }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$OUTPUT_SHA" != "$SOURCE_SHA" ]; then
            git push origin "HEAD:refs/heads/$BRANCH"
          fi
          if [ "$PR_NUMBER" != 0 ]; then
            git fetch origin "$BRANCH"
            test "$(git rev-parse FETCH_HEAD)" = "$OUTPUT_SHA"
            python3 .github/scripts/write-preparation-result.py verify-pr-head \
              --pr-number "$PR_NUMBER" --branch "$BRANCH" --expected-sha "$OUTPUT_SHA"
          fi

      - name: Summarize failed preparation
        if: failure()
        run: |
          {
            echo '### Dependency verification metadata'
            echo
            echo '**Result:** at least one cold platform lane, identity check, safe-union, publication, or race check failed.'
            echo
            echo 'No successful authoritative result was finalized; inspect the live branch head and lane/result evidence before retrying.'
          } >> "$GITHUB_STEP_SUMMARY"
