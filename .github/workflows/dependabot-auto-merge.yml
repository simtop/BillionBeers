name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch/minor Gradle Dependabot PRs
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Only grouped Gradle dependencies are eligible for auto-merge. GitHub Actions changes
      # always require a human review, even for patch/minor updates. Major Gradle bumps are also
      # excluded, regardless of dependabot.yml's group update-types filter. Requires branch
      # protection on master with required status checks; otherwise `--auto` merges immediately.
      - name: Enable auto-merge for patch/minor updates
        if:
          steps.metadata.outputs.dependency-group != 'github-actions' &&
          (steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
