name: Compare Verification Metadata Writers

# No pushes or deploy key. Both writers resolve the same immutable source on
# separate cold Linux runners; comparison cannot change the production alias.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  write:
    name: Cold Linux ${{ matrix.mode }} writer
    strategy:
      fail-fast: false
      matrix:
        mode: [reference, candidate]
    uses: ./.github/workflows/regen-verification-metadata.yml
    with:
      mode: ${{ matrix.mode }}

  compare:
    name: Require equivalent ledger coverage
    needs: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout comparator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download reference
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-metadata-reference-${{ github.sha }}
          path: reference
      - name: Download candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-metadata-candidate-${{ github.sha }}
          path: candidate
      - name: Compare policies, artifacts and accepted checksums
        run: >-
          python3 .github/scripts/check-verification-metadata-update.py --require-equivalent
          reference/gradle/verification-metadata.xml candidate/gradle/verification-metadata.xml
