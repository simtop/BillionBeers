name: CI PR Diagnosis

on:
  workflow_run:
    workflows: [Android CI]
    types: [in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  resolve:
    name: Resolve CI pull request
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve verified PR association
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/reconcile-ci-report.py --resolve-run "$RUN_ID"

  comment:
    name: Reconcile CI diagnosis
    needs: resolve
    if: needs.resolve.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      pull-requests: read
      issues: write
    # Events are wake-ups, not snapshots. Serialize all writers, and have each reconcile the
    # current run: a delayed old completion must not cancel or overwrite a newer reporter.
    concurrency:
      group: ci-diagnosis-${{ github.repository_id }}-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Maintain the current CI diagnosis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: python3 .github/scripts/reconcile-ci-report.py --pr-number "$PR_NUMBER"
