name: CI PR Diagnosis

on:
  workflow_run:
    workflows: [BillionBeers CI, Regenerate Verification Metadata]
    types: [requested, in_progress, completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  refresh-gate:
    name: Refresh a CI Gate blocked by preparation
    if: github.event.workflow_run.name == 'Regenerate Verification Metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    concurrency:
      group: dependency-gate-refresh-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted refresh script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retry only a preparation-blocked CI Gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PREPARATION_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/dependabot-preparation.py --refresh-ci-gate "$PREPARATION_RUN_ID"

  resolve:
    name: Resolve CI pull request
    if: >-
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.name == 'Regenerate Verification Metadata'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve verified PR association
        id: resolve
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/reconcile-ci-report.py --resolve-run "$RUN_ID"

  recovery:
    name: Recover one interrupted Dependabot preparation
    needs: resolve
    if: >-
      needs.resolve.outputs.pr_number != '' &&
      github.event.workflow_run.name == 'Regenerate Verification Metadata' &&
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: dependency-preparation-recovery-${{ github.event.workflow_run.id }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted recovery script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Retry only a verified current-head runner shutdown
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .github/scripts/dependabot-preparation.py --recover-run "$RUN_ID"

  comment:
    name: Reconcile CI diagnosis
    needs: resolve
    if: needs.resolve.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    # Completion events are wake-ups, not snapshots. Serialize all writers, and have each
    # reconcile the current run: a delayed old completion must not overwrite a newer reporter.
    concurrency:
      group: ci-diagnosis-${{ github.repository_id }}-${{ needs.resolve.outputs.pr_number }}
      cancel-in-progress: false
    steps:
      - name: Checkout trusted reporting scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Maintain the current CI diagnosis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        run: python3 .github/scripts/reconcile-ci-report.py --pr-number "$PR_NUMBER"
