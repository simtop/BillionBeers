name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel superseded runs on the same ref. Scoped to PRs only: a new push to a PR makes the
# in-flight run obsolete, so killing it saves a full emulator boot + 29-module test pass. Master
# runs are left alone (cancel-in-progress false) so every merged commit is still validated end to
# end - post-merge CI is the last line before a broken master.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    name: Code Style Formatting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Spotless Check
        id: spotless-check
        run: ./gradlew spotlessCheck

      # Lives here because this lane always runs and already has Gradle set up. Guards the one
      # verification gap CI is otherwise blind to: artifacts only Android Studio's sync resolves.
      # Without it a stale ledger is invisible until a human hits it in the IDE (ADR 0007).
      - name: Verify IDE-sync artifacts are covered by the ledger
        run: ./gradlew ideSyncArtifacts

      # Same reasoning as the step above: a cheap always-run guard on this lane rather than a
      # ninth job. The README's version table claims to be "automatically kept in sync" via
      # `make update-docs`, but nothing invoked it - by 2026-08-01 four of its five rows were
      # stale, because Dependabot lands version bumps weekly and each one re-stales the table.
      # Regenerating and diffing is what makes the word "automatically" true.
      - name: Verify the README version table matches the catalog
        run: |
          ./scripts/update_readme_versions.sh >/dev/null
          if ! git diff --quiet -- README.md; then
            echo "::error::README version table is stale. Run 'make update-docs' and commit."
            git --no-pager diff -- README.md
            exit 1
          fi

      - name: Format Fix Hint
        if: always() && steps.spotless-check.outcome == 'failure'
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "### 🎨 Formatting Check Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run the **Format Fix** workflow against this branch to auto-apply Spotless and push a fix commit:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run format_fix.yml --ref $BRANCH_NAME" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or trigger it manually from the Actions tab (pick this branch in the \"Run workflow\" dropdown)." >> $GITHUB_STEP_SUMMARY

  # Change-scope detector with per-lane verdict adoption. The heavy test lanes (unit / screenshot
  # / instrumented) key their `if:` off one output each. Two levels:
  #
  # Level 1 (whole PR): if every file in the PR diff is in the docs/skills/scripts safe-list, all
  # heavy lanes skip - a change that can't affect code can't break a test lane.
  #
  # Level 2 (per push): on a `synchronize` push to a code PR, a lane reruns only if (a) the pushed
  # diff could affect it, or (b) its verdict on the previous head was not green. A lane skipped
  # here is *adopting* its previous green verdict: the CI Gate treats `skipped` as pass, which is
  # sound only because the filter verified green-ness before deciding to skip.
  #
  # The logic, path->lane map, and the soundness rules that must survive edits all live in
  # .github/scripts/detect-change-scope.sh - deliberately under .github/ (NOT scripts/, which is
  # in the safe-list) so an edit to the filter itself runs the full suite and validates itself.
  changes:
    name: Detect change scope
    needs: format-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # reads the previous head's job conclusions for verdict adoption
    outputs:
      unit: ${{ steps.filter.outputs.unit }}
      screenshot: ${{ steps.filter.outputs.screenshot }}
      instrumented: ${{ steps.filter.outputs.instrumented }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # need the merge base and the previous head for the diffs

      - name: Classify changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/detect-change-scope.sh

  secret-scan:
    name: Secret Scan (gitleaks)
    # PR-only on purpose: branch protection means every change reaches master through a PR, so
    # scanning the PR's own commit range guards every change without re-scanning full history on
    # each push. A full-history scan would also re-flag long-since-removed commits forever and be
    # slow; a one-off deep-history audit (plus secret rotation) is the right remediation for the
    # past, not this recurring gate.
    if: github.event_name == 'pull_request'
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the base..head range below can be resolved; the scan itself is still
          # scoped to just this PR's commits.
          fetch-depth: 0

      - name: Scan PR commit range for secrets
        env:
          # Pinned release + verified checksum, in the same spirit as the SHA-pinned actions - a
          # floating install script or action tag is the exact mutable-supply-chain surface this
          # job exists to close. Bump both together when updating.
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -sSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git . \
            --log-opts="origin/${{ github.base_ref }}..HEAD" \
            --redact --verbose --no-banner

  lint:
    name: Static Analysis (Detekt)
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Detekt
        id: detekt-check
        run: make lint

      # Spotless output is a mechanical transform, so its always-run lane recommends the fixer.
      # A Detekt baseline is a suppression, so this dedicated lane recommends fixing the code and
      # presents re-baselining only as the reviewed exception.
      - name: Detekt Hint
        if: always() && steps.detekt-check.outcome == 'failure'
        run: |
          BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
          echo "### 🔍 Detekt Found New Issues" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The backlog that existed when this gate was adopted is already baselined, so a failure here means **new** findings. Fix them." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Reproduce locally:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "make lint" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If — and only if — the finding is pre-existing or a deliberate exception, re-baseline it. **This suppresses the rule, so the diff is the review**:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "make detekt-baseline MODULE=:the:module   # locally, then commit the diff" >> $GITHUB_STEP_SUMMARY
          echo "gh workflow run detekt_baseline.yml --ref $BRANCH_NAME   # or on the branch" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Never re-baseline to silence a finding you just introduced — that is how the gate stops working." >> $GITHUB_STEP_SUMMARY

  android-lint:
    name: Android Lint
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Google's Android-platform corpus (NewApi/minSdk, a11y, manifest, security, resources) -
      # orthogonal to Detekt and Konsist. checkDependencies lints the whole app graph in one pass;
      # new errors fail against app/lint-baseline.xml.
      - name: Run Android Lint
        run: make android-lint

      - name: Archive Lint Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-lint-reports
          path: '**/build/reports/lint-results-*.html'
          retention-days: 7

  dependency-guard:
    name: Dependency Guard
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Fails if the app's resolved release runtime graph drifts from app/dependencies/*.txt - a new
      # transitive or a shared library bumped by an added SDK (the classic runtime binary-incompat
      # cause) must be an intentional, re-baselined, reviewed change.
      - name: Run Dependency Guard
        run: make dependency-guard

  unit-tests:
    name: Unit Tests
    needs: [format-check, changes]
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: make test

      - name: Generate test-tier ownership inventory
        run: make test-tier-inventory

      - name: Run Konsist Architecture Rules
        run: make konsist

      # Konsist reads each feature's own build-script text, so it can't see a data-layer module
      # arriving through an intermediate dependency's api(...) declaration. This resolves the
      # actual compile classpath instead - same invariant (13, AGENTS.md), the gap Konsist leaves.
      - name: Check data-layer classpath boundary
        run: make check-data-layer-boundary

      # The checked-in graph policy validates direct and resolved transitive production project
      # edges, including explicit API exposure. It complements Konsist's faster source/build-script
      # diagnostics with the classpath Gradle actually gives each consumer.
      - name: Check resolved architecture graph policy
        run: make architecture-policy

      # High-water ratchet: jacocoRootReport reuses the debug unit tests just run above (they're
      # up-to-date), then fails if line coverage dropped below config/coverage-floor.txt.
      - name: Coverage floor check
        run: make coverage-check

      - name: Archive Test Reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-reports
          # test-results holds the JUnit XML, reports/tests the HTML. Screenshot-enabled modules
          # emit only the former - billionbeers.android.screenshot has to disable the HTML report,
          # because Paparazzi replaces the HTML reporter with one that calls a Gradle 8 internal.
          # With the HTML path alone this artifact was empty for most of the app.
          path: |
            **/build/test-results/
            **/build/reports/tests/
            build/reports/test-tier-inventory.md
          retention-days: 7

  # Two profile-balanced Paparazzi shards cut the lane's wall clock while preserving one stable
  # aggregate name for verdict adoption and CI Gate. Keep the explicit task union aligned with every
  # module applying billionbeers.android.screenshot; the local make target remains unsharded.
  screenshot_test_shards:
    name: Screenshot Test Shard (${{ matrix.shard }})
    needs: [format-check, changes]
    if: needs.changes.outputs.screenshot == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: browse-detail
            tasks: >-
              :feature:beerbrowse:verifyPaparazziDebug
              :feature:beerdetail:verifyPaparazziDebug
              :catalog:verifyPaparazziDebug
          - shard: design-list-search
            tasks: >-
              :core:designsystem:verifyPaparazziDebug
              :feature:beersearch:verifyPaparazziDebug
              :feature:beerslist:verifyPaparazziDebug
              :presentation_utils:verifyPaparazziDebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Verify screenshot shard
        id: verify-paparazzi
        run: ./gradlew ${{ matrix.tasks }} --continue
        continue-on-error: true

      - name: Identify failed modules
        if: always() && steps.verify-paparazzi.outcome == 'failure'
        id: failed-modules
        run: |
          FAILED_MODS=$(find . -name "failures" -type d -path "*/build/paparazzi/failures" | sed 's|^./||' | sed 's|/build/paparazzi/failures||' | sed 's|/|:|g' | sed 's|^|:|' | xargs | tr ',' ' ')
          echo "modules=$FAILED_MODS" >> "$GITHUB_OUTPUT"
          echo "Failed modules detected in ${{ matrix.shard }}: $FAILED_MODS"

      - name: Summarize screenshot shard
        if: always()
        run: |
          echo "### 📸 Screenshot shard: ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tasks: \`${{ matrix.tasks }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Outcome: **${{ steps.verify-paparazzi.outcome }}**" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.verify-paparazzi.outcome }}" = "failure" ]; then
            FAILED_MODS="${{ steps.failed-modules.outputs.modules }}"
            BRANCH_NAME="${{ github.head_ref || github.ref_name }}"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed modules:" >> "$GITHUB_STEP_SUMMARY"
            for mod in $FAILED_MODS; do
              echo "- \`$mod\`" >> "$GITHUB_STEP_SUMMARY"
            done
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Record only this shard's failures with:" >> "$GITHUB_STEP_SUMMARY"
            echo "\`gh workflow run record_screenshots.yml --ref $BRANCH_NAME -f modules=\"$FAILED_MODS\"\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshot failures
        if: always() && steps.verify-paparazzi.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-failures-${{ matrix.shard }}
          path: '**/build/paparazzi/failures/'
          retention-days: 7

      - name: Archive screenshot test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: screenshot-test-results-${{ matrix.shard }}
          path: '**/build/test-results/'
          if-no-files-found: error
          retention-days: 7

      - name: Signal screenshot failure
        if: always() && steps.verify-paparazzi.outcome == 'failure'
        run: exit 1

  screenshot-tests:
    name: Screenshot Tests (Paparazzi)
    needs: [changes, screenshot_test_shards]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.screenshot == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize screenshot shards
        run: |
          echo "### 📸 Screenshot shards" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result: **${{ needs.screenshot_test_shards.result }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Download screenshot failures
        id: download-failures
        if: needs.screenshot_test_shards.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: screenshot-failures-*
          path: /tmp/screenshot-failures
          merge-multiple: true

      - name: List failed screenshot modules
        if: steps.download-failures.outcome == 'success'
        run: |
          FAILED_MODS=$(find /tmp/screenshot-failures -name "failures" -type d -path "*/build/paparazzi/failures" | sed 's|^/tmp/screenshot-failures/||' | sed 's|/build/paparazzi/failures||' | sed 's|/|:|g' | sed 's|^|:|' | sort -u | xargs)
          if [ -n "$FAILED_MODS" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Failed modules: \`$FAILED_MODS\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail if a screenshot shard failed or was cancelled
        if: needs.screenshot_test_shards.result != 'success'
        run: exit 1

  # GMD runs on the runner through KVM. CI splits the seven owned test tasks across two runners;
  # local ciGroupDebugAndroidTest stays the single source of truth for the six debug modules.
  instrumented_test_shards:
    name: Instrumented Test Shard (${{ matrix.shard }})
    needs: [format-check, changes]
    if: needs.changes.outputs.instrumented == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - shard: integration
            tasks: >-
              :app:atdApi35DebugAndroidTest
              :feature:beerbrowse:atdApi35DebugAndroidTest
              :feature:beerdetail:atdApi35DebugAndroidTest
              :app-release-smoke:atdApi35ReleaseSmokeAndroidTest
          - shard: standalone
            tasks: >-
              :beer_database:atdApi35DebugAndroidTest
              :feature:beerslist:atdApi35DebugAndroidTest
              :feature:beersearch:atdApi35DebugAndroidTest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM
        # GitHub's Linux runners support nested virtualization, but the device node is not
        # writable by default. Without this the emulator falls back to software rendering and
        # takes many minutes (or times out).
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      # A `system-images` cache was removed here on purpose. Restoring a partial system-image cache
      # breaks Gradle Managed Devices' `atdApi35Setup` (device provisioning) task: every CI run
      # with a cache *miss* (fresh sdkmanager download) passed, and every run with a cache *hit*
      # failed at setup. GMD now downloads the image each run (~2m45s). Do NOT re-add a bare
      # `system-images` cache - a correct re-introduction has to capture the whole SDK/AVD state
      # (licenses + package registry + the created AVD), and must be proven on a live CI run.

      - name: Run instrumented shard
        run: ./gradlew ${{ matrix.tasks }}

      - name: Summarize instrumented shard
        if: always()
        run: |
          echo "### 🤖 Instrumented shard: ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Tasks: \`${{ matrix.tasks }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Job status: **${{ job.status }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive instrumented test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumented-test-reports-${{ matrix.shard }}
          path: |
            **/build/reports/androidTests/managedDevice/
            **/build/outputs/androidTest-results/managedDevice/
          retention-days: 7

  instrumented-tests:
    name: Instrumented Tests (Gradle Managed Device)
    needs: [changes, instrumented_test_shards]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.instrumented == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Summarize instrumented shards
        run: |
          echo "### 🤖 Instrumented shards" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Matrix result: **${{ needs.instrumented_test_shards.result }}**" >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if an instrumented shard failed or was cancelled
        if: needs.instrumented_test_shards.result != 'success'
        run: exit 1

  # Single aggregate gate - make THIS the only required status check in branch protection, not the
  # individual jobs. Why: a `skipped` job (secret-scan is PR-only; future path-filtered lanes will
  # skip on docs/CI-only changes) reports neither success nor failure, and a *required* skipped
  # check blocks merge forever. This gate treats `skipped` as fine and fails only on a real
  # failure or cancellation, so path filtering stays safe and required-checks are managed in one
  # place. `if: always()` so the gate runs even when an upstream job fails.
  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - format-check
      - changes
      - secret-scan
      - lint
      - android-lint
      - dependency-guard
      - unit-tests
      - screenshot-tests
      - instrumented-tests
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more CI jobs failed or were cancelled:"
          echo '${{ toJSON(needs) }}'
          exit 1
