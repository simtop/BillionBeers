name: Android release evidence
run-name: Android release-smoke evidence | ref=${{ github.ref_name }}

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: android-release-evidence-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    name: Require the default branch
    runs-on: ubuntu-latest
    steps:
      - name: Reject manual runs outside master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Android release evidence can only run from master."
          exit 1

  release:
    name: Publish minified release-smoke evidence
    needs: guard
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout the dispatched master revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enable KVM for the managed device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 23
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate release notes and reserve the version tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          make release-preflight
          VERSION_CODE="$(sed -n 's/^billionbeers\.versionCode=//p' gradle.properties)"
          if [[ ! "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "::error::Expected exactly one numeric billionbeers.versionCode."
            exit 1
          fi

          TAG_NAME="android-release-smoke-${VERSION_CODE}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" >/dev/null 2>&1; then
            echo "::error::Tag ${TAG_NAME} already exists; refusing to replace release evidence."
            exit 1
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Run minified release confidence smoke tests
        run: env GRADLE_RUNNER="./gradlew" make release-smoke

      - name: Prepare release evidence and notes
        env:
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          mkdir -p "$RUNNER_TEMP/android-release-evidence"
          cp app/build/outputs/mapping/releaseSmoke/mapping.txt \
            "$RUNNER_TEMP/android-release-evidence/mapping.txt"
          cp app/build/outputs/release-smoke/manifest.txt \
            "$RUNNER_TEMP/android-release-evidence/checksums.txt"
          {
            cat "fastlane/metadata/android/en-US/changelogs/${VERSION_CODE}.txt"
            printf '\n\nThis GitHub prerelease records minified release-smoke evidence. '
            printf 'The APK is debug-signed; this evidence does not represent Play signing or delivery.\n'
          } > "$RUNNER_TEMP/android-release-evidence/release-notes.md"

      - name: Create versioned GitHub prerelease with evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          gh release create "$TAG_NAME" \
            "$RUNNER_TEMP/android-release-evidence/mapping.txt" \
            "$RUNNER_TEMP/android-release-evidence/checksums.txt" \
            --target "$GITHUB_SHA" \
            --title "Android release-smoke evidence ${VERSION_CODE}" \
            --notes-file "$RUNNER_TEMP/android-release-evidence/release-notes.md" \
            --prerelease
