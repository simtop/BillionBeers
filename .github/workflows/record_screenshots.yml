name: Record Screenshots

on:
  workflow_dispatch:
    inputs:
      record_all:
        description: 'ALL Modules'
        type: boolean
        required: false
        default: false
      modules:
        description: 'Space-separated module paths (e.g., :feature:beerslist :presentation_utils).'
        required: false
        default: ''
      use_clean:
        description: 'Clean'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: record-screenshots-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up JDK 23
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Record Screenshots
        env:
          RECORD_ALL: ${{ github.event.inputs.record_all }}
          MODULES: ${{ github.event.inputs.modules }}
          USE_CLEAN: ${{ github.event.inputs.use_clean }}
        run: bash .github/scripts/record-screenshots.sh

      - name: Package recorded screenshot changes
        run: |
          python3 -I .github/scripts/ci-writeback.py snapshot-screenshots \
            --output "$RUNNER_TEMP/screenshots.zip"

      - name: Upload screenshots archive for trusted writeback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-output-${{ github.run_attempt }}
          path: ${{ runner.temp }}/screenshots.zip
          if-no-files-found: error
          retention-days: 1

      - name: Archive recorded snapshots
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: recorded-snapshots
          path: '**/src/test/snapshots/images/'
          if-no-files-found: error
