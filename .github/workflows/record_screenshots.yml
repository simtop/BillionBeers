name: Record Screenshots

on:
  workflow_dispatch:
    inputs:
      record_all:
        description: 'ALL Modules'
        type: boolean
        required: false
        default: false
      modules:
        description: 'Space-separated module paths (e.g., :feature:beerslist :presentation_utils).'
        required: false
        default: ''
      use_clean:
        description: 'Clean'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: record-screenshots-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          lfs: true
          ssh-key: ${{ secrets.VERIFICATION_METADATA_DEPLOY_KEY }}

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Screenshot Branch
        run: |
          BRANCH_NAME="${GITHUB_REF_NAME}"
          SCREENSHOT_BRANCH="${BRANCH_NAME}_screenshots"
          echo "SCREENSHOT_BRANCH=$SCREENSHOT_BRANCH" >> $GITHUB_ENV
          git checkout -b "$SCREENSHOT_BRANCH"

      - name: Record Screenshots
        env:
          RECORD_ALL: ${{ github.event.inputs.record_all }}
          MODULES: ${{ github.event.inputs.modules }}
          USE_CLEAN: ${{ github.event.inputs.use_clean }}
        run: bash .github/scripts/record-screenshots.sh

      - name: Commit and Push Screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find . -path "*/src/test/snapshots/images" -type d -exec git add -A {} +
          
          if git diff --cached --quiet; then
            echo "No changes in screenshots. Skipping commit and push."
          else
            git commit -m "Regenerate screenshots for $GITHUB_REF_NAME"
            git push origin "$SCREENSHOT_BRANCH" --force-with-lease
            
            # Check if PR already exists
            PR_EXISTS=$(gh pr list --head "$SCREENSHOT_BRANCH" --base "$GITHUB_REF_NAME" --json number --jq '.[0].number')
            
            if [ -z "$PR_EXISTS" ]; then
              gh pr create \
                --title "📸 Screenshot updates for $GITHUB_REF_NAME" \
                --body "This PR was automatically generated to update the screenshot golden values for branch **$GITHUB_REF_NAME**." \
                --base "$GITHUB_REF_NAME" \
                --head "$SCREENSHOT_BRANCH"
            else
              echo "PR already exists: #$PR_EXISTS. Branch updated."
            fi
          fi

      - name: Archive New Snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: recorded-snapshots
          path: '**/src/test/snapshots/images/'
          if-no-files-found: error
