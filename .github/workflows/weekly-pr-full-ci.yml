name: Weekly full PR CI

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  dispatch:
    name: Dispatch full CI for open PRs
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted master workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: master

      - name: Dispatch full CI for open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python3 -I .github/scripts/dispatch-weekly-pr-full-ci.py
