name: Format Fix

on:
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  format:
    name: Apply Spotless formatting and open a fix PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Spotless Apply
        run: ./gradlew spotlessApply

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create Format Branch
        run: |
          FORMAT_BRANCH="${GITHUB_REF_NAME}_format"
          echo "FORMAT_BRANCH=$FORMAT_BRANCH" >> $GITHUB_ENV
          git checkout -b "$FORMAT_BRANCH"

      - name: Commit formatting fix and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to format - working tree already clean."
          else
            git commit -m "chore: apply Spotless formatting"
            git push origin "$FORMAT_BRANCH" --force

            # Check if PR already exists
            PR_EXISTS=$(gh pr list --head "$FORMAT_BRANCH" --base "$GITHUB_REF_NAME" --json number --jq '.[0].number')

            if [ -z "$PR_EXISTS" ]; then
              gh pr create \
                --title "🧹 Spotless formatting fixes for $GITHUB_REF_NAME" \
                --body "This PR was automatically generated by the Format Fix workflow to apply Spotless formatting to branch **$GITHUB_REF_NAME**." \
                --base "$GITHUB_REF_NAME" \
                --head "$FORMAT_BRANCH"
            else
              echo "PR already exists: #$PR_EXISTS. Branch updated."
            fi
          fi
