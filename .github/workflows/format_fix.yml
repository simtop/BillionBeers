name: Format Fix

# Dispatch against a branch to apply `spotlessApply` and commit the result to that same branch.
# Gradle runs without write credentials. The trusted CI Writeback workflow validates and pushes
# the generated patch after this run completes.
#
# Note it cannot rescue a branch whose verification ledger is stale: `spotlessApply` is itself a
# Gradle invocation and dies during plugin resolution before Spotless runs. On a dependency bump,
# regen-verification-metadata.yml has to land first.

on:
  workflow_dispatch: {}

# The formatter job is read-only; the trusted CI Writeback workflow owns write credentials.
permissions:
  contents: read

concurrency:
  group: format-fix-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply Spotless formatting to the branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on the default branch
        # A direct push to master would bypass review; branch protection would reject it anyway,
        # so fail here with a message that says why rather than deep in a git error.
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Dispatch this against a feature branch, not ${{ github.ref_name }}."
          echo "It commits directly to the branch it runs on."
          exit 1

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Set up JDK 23
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Spotless Apply
        run: ./gradlew spotlessApply

      - name: Snapshot formatting patch
        run: |
          git diff --binary --no-renames --no-ext-diff --no-textconv HEAD > "$RUNNER_TEMP/generated.patch"

      - name: Upload formatting patch for trusted writeback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-output-${{ github.run_attempt }}
          path: ${{ runner.temp }}/generated.patch
          if-no-files-found: error
          retention-days: 1
