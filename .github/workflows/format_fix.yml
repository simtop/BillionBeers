name: Format Fix

# Dispatch against a branch to apply `spotlessApply` and commit the result to that same branch.
#
# It commits directly and opens no PR. spotlessApply is a deterministic mechanical transform - the
# same tool that gates CI, run in write mode - so there is nothing in its output for a reviewer to
# approve. The previous design pushed to `<branch>_format` and opened a PR *against* the branch it
# ran on, which meant a second PR to merge before the first could land; on a Dependabot PR that
# added work rather than removing it.
#
# The push uses the write deploy key, NOT GITHUB_TOKEN, for the reason recorded in ADR 0007:
# events created with GITHUB_TOKEN do not trigger workflow runs, so a format commit pushed with it
# would move an open PR's head to a SHA that CI never runs on - "CI Gate" would stay pending
# forever and `gh pr merge --auto` would hang silently. That is strictly worse than the current
# failure mode, which at least goes red.
#
# Note it cannot rescue a branch whose verification ledger is stale: `spotlessApply` is itself a
# Gradle invocation and dies during plugin resolution before Spotless runs. On a dependency bump,
# regen-verification-metadata.yml has to land first.

on:
  workflow_dispatch: {}

# The deploy key provides the push; the token needs nothing beyond checkout.
permissions:
  contents: read

concurrency:
  group: format-fix-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  format:
    name: Apply Spotless formatting to the branch
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on the default branch
        # A direct push to master would bypass review; branch protection would reject it anyway,
        # so fail here with a message that says why rather than deep in a git error.
        if: github.ref_name == github.event.repository.default_branch
        run: |
          echo "::error::Dispatch this against a feature branch, not ${{ github.ref_name }}."
          echo "It commits directly to the branch it runs on."
          exit 1

      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}
          ssh-key: ${{ secrets.VERIFICATION_METADATA_DEPLOY_KEY }}

      - name: Set up JDK 23
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v5
        with:
          java-version: '23'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: wrapper

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run Spotless Apply
        run: ./gradlew spotlessApply

      - name: Commit and push if anything was reformatted
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -u, not -A: stage only files already tracked. Spotless never creates files, and the
          # repo deliberately carries untracked local-only content that must never be committed.
          git add -u
          if git diff --cached --quiet; then
            echo "Nothing to format - working tree already clean."
          else
            git commit -m "chore: apply Spotless formatting"
            git push origin HEAD:"$GITHUB_REF_NAME"
            echo "Pushed a formatting commit to $GITHUB_REF_NAME."
          fi
