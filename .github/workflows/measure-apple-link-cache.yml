name: Measure Apple Link Cache

on:
  workflow_dispatch:

permissions:
  contents: read
cache-mode: read

concurrency:
  group: measure-apple-link-cache
  cancel-in-progress: false

jobs:
  trial:
    name: Apple trial (${{ matrix.cache }})
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        cache: [cold, warm]
    runs-on: macos-15
    timeout-minutes: 75
    env:
      GRADLE_RUNNER: ./gradlew --profile --no-build-cache
      GRADLE_OPTS: -Dorg.gradle.caching=false
      IOS_RUNTIME: '18.5'
      IOS_DEVICE_NAME: 'BillionBeers iPhone 16'
      IOS_DEVICE_TYPE: 'com.apple.CoreSimulator.SimDeviceType.iPhone-16'
      IOS_HOST_DESTINATION: 'platform=iOS Simulator,name=BillionBeers iPhone 16,OS=18.5'
      XCODE_PATH: '/Applications/Xcode_16.4.app'
    steps:
      - name: Checkout the exact dispatched commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Select pinned Xcode and require a fresh Native home
        run: |
          test -d "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH"
          if [ -d "$HOME/.konan" ] && [ -n "$(find "$HOME/.konan" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "::error::The runner already has Kotlin/Native state."
            exit 1
          fi

      - name: Identify Native component cache
        id: cache-key
        run: python3 -I .github/scripts/native-cache.py

      - name: Restore the exact Native component cache
        id: cache-restore
        if: matrix.cache == 'warm'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-key.outputs.paths }}
          key: ${{ steps.cache-key.outputs.key }}
          fail-on-cache-miss: true

      - name: Copy the filtered Native components
        id: cache-copy
        if: matrix.cache == 'warm'
        env:
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true || { echo "::error::The warm trial requires an exact Native cache hit."; exit 1; }
          bash .github/scripts/run-timed-command.sh python3 -I .github/scripts/native-cache.py --mode restore

      - name: Set up JDK 23
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v5
        with:
          java-version: '23'
          distribution: temurin

      - name: Set up Gradle without a shared cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
        with:
          gradle-version: wrapper
          cache-disabled: true

      - name: Record trial identity
        env:
          TRIAL: ${{ matrix.cache }}
          CACHE_KEY: ${{ steps.cache-key.outputs.key }}
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p build/ci-phase-timings
          {
            printf 'trial=%s\nsource_sha=%s\ncache_key=%s\ncache_hit=%s\n' "$TRIAL" "$GITHUB_SHA" "$CACHE_KEY" "$CACHE_HIT"
            printf 'image=%s\nimage_version=%s\narchitecture=%s\n' "$ImageOS" "$ImageVersion" "$RUNNER_ARCH"
            xcodebuild -version
            java -version 2>&1
          } | tee build/ci-phase-timings/apple-cache-trial.txt

      - name: Create and boot pinned simulator
        id: simulator
        run: |
          runtime="$(xcrun simctl list runtimes | awk -v name="iOS $IOS_RUNTIME (" 'index($0, name) && $0 !~ /unavailable/ {print $NF; exit}')"
          test -n "$runtime"
          device="$(xcrun simctl create "$IOS_DEVICE_NAME" "$IOS_DEVICE_TYPE" "$runtime")"
          echo "udid=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b

      - name: Compile Apple targets
        id: compile
        run: bash .github/scripts/run-timed-command.sh make ios-compile

      - name: Link Apple frameworks
        id: framework
        run: bash .github/scripts/run-timed-command.sh make ios-framework

      - name: Build iOS host
        id: host
        run: bash .github/scripts/run-timed-command.sh make ios-host-build

      - name: Run Apple simulator tests
        id: tests
        run: bash .github/scripts/run-timed-command.sh make ios-test

      - name: Verify native test reports
        run: python3 .github/scripts/validate-native-test-reports.py

      - name: Record phase timings
        if: always()
        env:
          CACHE_COPY: ${{ steps.cache-copy.outputs.elapsed_seconds }}
          CACHE_COPY_OUTCOME: ${{ steps.cache-copy.outcome }}
          COMPILE: ${{ steps.compile.outputs.elapsed_seconds }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          FRAMEWORK: ${{ steps.framework.outputs.elapsed_seconds }}
          FRAMEWORK_OUTCOME: ${{ steps.framework.outcome }}
          HOST: ${{ steps.host.outputs.elapsed_seconds }}
          HOST_OUTCOME: ${{ steps.host.outcome }}
          TESTS: ${{ steps.tests.outputs.elapsed_seconds }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          python3 .github/scripts/render-phase-timings.py \
            --title "Apple Native cache trial" \
            --phase "Native cache copy|$CACHE_COPY_OUTCOME|$CACHE_COPY" \
            --phase "Apple compilation|$COMPILE_OUTCOME|$COMPILE" \
            --phase "Apple framework linking|$FRAMEWORK_OUTCOME|$FRAMEWORK" \
            --phase "iOS host build|$HOST_OUTCOME|$HOST" \
            --phase "Apple simulator tests|$TESTS_OUTCOME|$TESTS" \
            --json build/ci-phase-timings/apple-cache-trial.json

      - name: Archive comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: apple-link-cache-${{ matrix.cache }}
          path: |
            build/ci-phase-timings/
            build/reports/profile/
            **/build/test-results/iosSimulatorArm64Test/TEST-*.xml
          if-no-files-found: error
          retention-days: 14

      - name: Shut down simulator
        if: always() && steps.simulator.outputs.udid != ''
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: xcrun simctl shutdown "$SIMULATOR_UDID" || true
