name: CI Writeback

# Build workflows upload generated patches without credentials. This workflow runs from the
# default branch on workflow_run, validates the source run, and alone receives the write key.
on:
  workflow_run:
    workflows: [Format Fix, Detekt Baseline, Record Screenshots]
    types: [completed]

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-writeback-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Validate generated-output source
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: read
      contents: read
    outputs:
      kind: ${{ steps.source.outputs.kind }}
      branch: ${{ steps.source.outputs.branch }}
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
      attempt: ${{ steps.source.outputs.attempt }}
      artifact_name: ${{ steps.source.outputs.artifact_name }}
    steps:
      - name: Checkout trusted default-branch validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate upstream workflow identity
        id: source
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -I .github/scripts/ci-writeback.py resolve

  publish:
    name: Apply validated generated output
    needs: resolve
    if: needs.resolve.outputs.run_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted default-branch writer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          lfs: true
          ssh-key: ${{ secrets.VERIFICATION_METADATA_DEPLOY_KEY }}

      - name: Download output from the exact source run attempt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.artifact_name }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          path: ${{ runner.temp }}/generated-output

      - name: Validate paths and publish output
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          WRITEBACK_KIND: ${{ needs.resolve.outputs.kind }}
          SOURCE_BRANCH: ${{ needs.resolve.outputs.branch }}
          SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          if [[ "$WRITEBACK_KIND" == "screenshots" ]]; then
            python3 -I .github/scripts/ci-writeback.py publish \
              --kind "$WRITEBACK_KIND" --branch "$SOURCE_BRANCH" --sha "$SOURCE_SHA" \
              --screenshots-archive "$RUNNER_TEMP/generated-output/screenshots.zip"
          else
            python3 -I .github/scripts/ci-writeback.py publish \
              --kind "$WRITEBACK_KIND" --branch "$SOURCE_BRANCH" --sha "$SOURCE_SHA" \
              --patch "$RUNNER_TEMP/generated-output/generated.patch"
          fi
