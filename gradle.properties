# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Sized for the reference machine in config/build-time-budget.txt (8 cores, 16 GB): 4g Gradle +
# 2g Kotlin leaves ~10g for the OS and an IDE. Raise both together on a bigger machine.
#
# Heap was 2048m, which is thin for ~30 modules with org.gradle.parallel and the configuration
# cache both on. Metaspace is raised from 1G on direct evidence rather than a guess: a daemon on
# this machine was found in state "STOPPED (after running out of JVM Metaspace)". That is a
# mitigation for classloader accumulation across many builds in one daemon, not a cure - if it
# recurs, the daemon is leaking and the number is not the problem.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM and was never configured, so it ran on defaults while
# every module in the build compiles through it.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
# Official Kotlin code style
kotlin.code.style=official

# Gradle 9 & AGP 9.0 Modernization Properties:
# -------------------------------------------
# Ignore the built-in Kotlin support check to allow manual configuration adjustments if needed
systemProp.kotlin.ignore.agp.builtin.kotlin=true
# Suppress the warning when AGP with built-in Kotlin is applied alongside standalone Kotlin plugin
systemProp.kotlin.diagnostics.suppress.AgpWithBuiltInKotlinApplied=true
ksp.useKSP2=true
# Non-transitive R classes: each module only sees its own resources, reducing APK size.
android.nonTransitiveRClass=true

# Optimized resource shrinking via R8 (uses R8's graph analysis for more aggressive removal).
android.r8.optimizedResourceShrinking=true

# Benchmark configuration: suppress warnings for emulator/debuggable environments.
androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE,NOT-SELF-INSTRUMENTING
androidx.benchmark.enabledRules=Microbenchmark,Macrobenchmark

# AGP 9.0 Migration Flags:
# --------------------------
# Run unit tests for all build types, not just the tested one.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Disable unique package name enforcement (allows multi-module projects to share package namespaces).
android.uniquePackageNames=false
# Skip AGP's dependency constraints, which improves project import perf on large repos.
# (AGP-recommended replacement for the removed excludeLibraryComponentsFromConstraints flag.)
android.dependency.useConstraints=false
# Relax R8 strict full-mode for keep rules (prevents crashes from overly aggressive shrinking).
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# App version. Here rather than in build-logic's Versions.kt because these are the most frequently
# changed values in the build, and a constant in the convention jar makes every bump recompile
# build-logic - invalidating every module's configuration and missing the configuration cache.
# Read by billionbeers.android.application and by scripts/play-listing.sh.
billionbeers.versionCode=67
billionbeers.versionName=67
