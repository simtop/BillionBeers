# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# MEASURED, not guessed. `scripts/measure-jvm-memory.sh 2g 3g 4g` against assembleDebug on the
# 16 GB machine this project is developed on, with the usual emulator and browser running:
#
#   heap   wall     live set   GC overhead   swapped
#   2g     39.3s    1621 MB    38.1%         955 MB
#   3g     33.3s    1608 MB    24.9%          40 MB     <- chosen
#   4g     36.3s    1599 MB    23.7%         326 MB
#
# Two things that table settles. The old 2048m sat at 1.26x a ~1.6 GB live set, under the 1.5-2x
# a collector needs to stay out of the way, and it paid 38% of the build in GC. And 4g is *worse*
# than 3g here - marginally less GC, but it takes the extra heap from the same 16 GB the emulator
# is using, so it swaps eight times as much and finishes 3s slower. More heap is not more speed
# once the machine is the constraint.
#
# -Xmx is a ceiling, not a reservation - the JVM commits lazily - so an oversized value costs
# nothing on a small build and everything on a large one, which is exactly when the emulator is
# also under pressure.
#
# DO NOT copy these onto a different machine, and do not tune them by feel. Re-run
# scripts/measure-jvm-memory.sh there; it prints the lines to paste.
#
# Metaspace is the one number here set from direct evidence rather than a budget: a daemon on this
# machine was found in state "STOPPED (after running out of JVM Metaspace)" at the old 1g. That is
# a mitigation for classloader accumulation across many builds in one daemon, not a cure - if it
# recurs, the daemon is leaking and the number is not the problem.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1536m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# The Kotlin compile daemon is a separate JVM that every module compiles through, and it was never
# configured at all - so it ran on whatever the Kotlin Gradle plugin defaults to, which varies by
# plugin version. Measured with MODE=kotlin, run TWICE with the candidate order reversed, because
# a single pass cannot tell a heap effect from the build progressively warming up:
#
#   heap     1st order   2nd order (reversed)   mean
#   1g          44.1s          40.7s            42.4s
#   1536m       37.9s          37.2s            37.6s
#   2g          32.6s          33.8s            33.2s   <- chosen
#   3g          30.1s          38.0s            34.1s
#
# The control is what makes this readable. 1g is slowest even from the LAST slot, where warming
# helps most, so it is genuinely too small. 3g looks like the winner in one order and mid-pack in
# the other - that swing is position, not heap. 2g is the only candidate that is fast in both.
#
# Honest limitation: only wall time is trustworthy here. The Kotlin daemon exits as soon as
# compilation ends, and its GC log was not reliably captured, so live-set and GC-overhead figures
# for this daemon varied ~40% between identical runs and were not used to pick the value.
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app"s APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Automatically convert third-party libraries to use AndroidX
android.enableJetifier=false
# Kotlin code style for this project: "official" or "obsolete":
# Official Kotlin code style
kotlin.code.style=official

# Gradle 9 & AGP 9.0 Modernization Properties:
# -------------------------------------------
# Ignore the built-in Kotlin support check to allow manual configuration adjustments if needed
systemProp.kotlin.ignore.agp.builtin.kotlin=true
# Suppress the warning when AGP with built-in Kotlin is applied alongside standalone Kotlin plugin
systemProp.kotlin.diagnostics.suppress.AgpWithBuiltInKotlinApplied=true
ksp.useKSP2=true
# Non-transitive R classes: each module only sees its own resources, reducing APK size.
android.nonTransitiveRClass=true

# Optimized resource shrinking via R8 (uses R8's graph analysis for more aggressive removal).
android.r8.optimizedResourceShrinking=true

# Benchmark configuration: suppress warnings for emulator/debuggable environments.
androidx.benchmark.suppressErrors=EMULATOR,DEBUGGABLE,NOT-SELF-INSTRUMENTING
androidx.benchmark.enabledRules=Microbenchmark,Macrobenchmark

# AGP 9.0 Migration Flags:
# --------------------------
# Run unit tests for all build types, not just the tested one.
android.onlyEnableUnitTestForTheTestedBuildType=false
# Disable unique package name enforcement (allows multi-module projects to share package namespaces).
android.uniquePackageNames=false
# Skip AGP's dependency constraints, which improves project import perf on large repos.
# (AGP-recommended replacement for the removed excludeLibraryComponentsFromConstraints flag.)
android.dependency.useConstraints=false
# Relax R8 strict full-mode for keep rules (prevents crashes from overly aggressive shrinking).
android.r8.strictFullModeForKeepRules=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# App version. Here rather than in build-logic's Versions.kt because these are the most frequently
# changed values in the build, and a constant in the convention jar makes every bump recompile
# build-logic - invalidating every module's configuration and missing the configuration cache.
# Read by billionbeers.android.application and by scripts/play-listing.sh.
billionbeers.versionCode=67
billionbeers.versionName=67
